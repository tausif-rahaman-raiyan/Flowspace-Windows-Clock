<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowspace Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: #fff;
      background: transparent;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .overlay-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 20, 26, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-app-region: drag;
      cursor: grab;
    }
    .overlay-card:active {
      cursor: grabbing;
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      opacity: 0.85;
    }
    .grip {
      font-size: 13px;
      opacity: 0.55;
    }
    .actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #fff;
    }
    .timer-center {
      text-align: center;
      margin: 2px 0;
    }
    .time-read {
      font-size: clamp(34px, 16vw, 44px);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
      line-height: 1;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .session-tag {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .btn.primary {
      background: #fff;
      color: #111;
      border-color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="overlay-card" id="card">
    <div class="overlay-header">
      <div class="title-area">
        <span class="grip">⠿</span>
        <span id="overlayMode">Pomodoro</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="expandBtn" title="Back to Full Flowspace App" type="button">⤢</button>
        <button class="icon-btn" id="closeBtn" title="Close Overlay" type="button">×</button>
      </div>
    </div>
    <div class="timer-center">
      <div class="time-read" id="overlayTime">25:00</div>
      <div class="session-tag" id="overlaySession">Focus session</div>
    </div>
    <div class="controls">
      <button class="btn primary" id="toggleBtn" type="button">Start</button>
      <button class="btn" id="resetBtn" type="button">Reset</button>
      <button class="btn" id="restoreBtn" type="button" title="Back to normal view">Full View</button>
    </div>
  </div>

  <script>
    const timeEl = document.getElementById('overlayTime');
    const modeEl = document.getElementById('overlayMode');
    const sessionEl = document.getElementById('overlaySession');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const expandBtn = document.getElementById('expandBtn');
    const closeBtn = document.getElementById('closeBtn');

    if (window.electronAPI) {
      window.electronAPI.onTimerSyncFromMain((data) => {
        if (!data) return;
        if (data.time) timeEl.textContent = data.time;
        if (data.mode) modeEl.textContent = data.mode;
        if (data.session) sessionEl.textContent = data.session;
        if (data.running !== undefined) {
          toggleBtn.textContent = data.running ? 'Pause' : 'Start';
        }
      });

      toggleBtn.onclick = () => window.electronAPI.sendTimerActionFromMini('toggle');
      resetBtn.onclick = () => window.electronAPI.sendTimerActionFromMini('reset');
      restoreBtn.onclick = () => window.electronAPI.restoreMainWindow();
      expandBtn.onclick = () => window.electronAPI.restoreMainWindow();
      closeBtn.onclick = () => window.electronAPI.toggleMiniOverlay();
    }
  </script>
</body>
</html>
