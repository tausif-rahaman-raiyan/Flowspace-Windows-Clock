<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowspace Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: #fff;
      background: transparent;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .overlay-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 20, 27, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      padding: 10px 14px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-app-region: drag;
      cursor: grab;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .overlay-card:active {
      cursor: grabbing;
    }
    .overlay-card:hover {
      border-color: rgba(255, 255, 255, 0.28);
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.9);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge.break {
      background: rgba(74, 222, 128, 0.18);
      border-color: rgba(74, 222, 128, 0.35);
      color: #86efac;
    }
    .grip {
      font-size: 13px;
      opacity: 0.45;
    }
    .actions {
      display: flex;
      gap: 5px;
      -webkit-app-region: no-drag;
    }
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 11px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: 0.18s ease;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.06);
    }
    .timer-center {
      text-align: center;
      padding: 4px 6px 6px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin: 3px 0 4px;
    }
    .time-read {
      font-size: clamp(34px, 15vw, 42px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 4px 18px rgba(255, 255, 255, 0.15), 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .mini-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      margin: 6px auto 4px;
      overflow: hidden;
    }
    .mini-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffffff, #c8d6e5);
      transition: width 0.25s ease;
    }
    .mini-bar-fill.break {
      background: linear-gradient(90deg, #4ade80, #22c55e);
    }
    .session-tag {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.72);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      transition: 0.18s ease;
      text-align: center;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn.primary {
      background: #fff;
      color: #111;
      border-color: #fff;
      font-weight: 750;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.25);
    }
    .btn.primary:hover {
      background: #f0f2f5;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div class="overlay-card" id="card">
    <div class="overlay-header">
      <div class="title-area">
        <span class="grip">⠿</span>
        <span id="overlayMode" class="badge">Pomodoro</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="expandBtn" title="Back to Full Flowspace App" type="button">⤢</button>
        <button class="icon-btn" id="closeBtn" title="Close Overlay" type="button">×</button>
      </div>
    </div>
    <div class="timer-center">
      <div class="time-read" id="overlayTime">25:00</div>
      <div class="mini-bar"><div class="mini-bar-fill" id="overlayBarFill"></div></div>
      <div class="session-tag" id="overlaySession">Focus session</div>
    </div>
    <div class="controls">
      <button class="btn primary" id="toggleBtn" type="button">Start</button>
      <button class="btn" id="resetBtn" type="button">Reset</button>
      <button class="btn" id="restoreBtn" type="button" title="Back to normal view">Full View</button>
    </div>
  </div>

  <script>
    const timeEl = document.getElementById('overlayTime');
    const modeEl = document.getElementById('overlayMode');
    const sessionEl = document.getElementById('overlaySession');
    const barFillEl = document.getElementById('overlayBarFill');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const expandBtn = document.getElementById('expandBtn');
    const closeBtn = document.getElementById('closeBtn');

    if (window.electronAPI) {
      window.electronAPI.onTimerSyncFromMain((data) => {
        if (!data) return;
        if (data.time) timeEl.textContent = data.time;
        if (data.mode) {
          modeEl.textContent = data.mode;
          modeEl.classList.toggle('break', data.kind === 'break');
        }
        if (data.session) sessionEl.textContent = data.session;
        if (data.percent !== undefined && barFillEl) {
          barFillEl.style.width = `${data.percent}%`;
          barFillEl.classList.toggle('break', data.kind === 'break');
        }
        if (data.running !== undefined) {
          toggleBtn.textContent = data.running ? 'Pause' : 'Start';
        }
      });

      toggleBtn.onclick = () => window.electronAPI.sendTimerActionFromMini('toggle');
      resetBtn.onclick = () => window.electronAPI.sendTimerActionFromMini('reset');
      restoreBtn.onclick = () => window.electronAPI.restoreMainWindow();
      expandBtn.onclick = () => window.electronAPI.restoreMainWindow();
      closeBtn.onclick = () => window.electronAPI.toggleMiniOverlay();
    }
  </script>
</body>
</html>
